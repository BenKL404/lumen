[package]
name = "lumen"
version = "1.0.1"
edition = "2021"
description = "Lecteur vidéo moderne pour Linux, inspiré de PotPlayer"
license = "GPL-3.0-or-later"
repository = "https://github.com/BenKL404/lumen"

[dependencies]
cxx = "1.0.95"
cxx-qt = "0.7"
cxx-qt-lib = { version = "0.7", default-features = false, features = ["qt_gui", "qt_qml"] }
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
ureq = { version = "3.4.2", features = ["json"] }
zbus = "5.19.0"

[build-dependencies]
cxx-qt-build = { version = "0.7", features = ["link_qt_object_files"] }
