[package]
name = "lumen"
version = "0.1.0"
edition = "2021"

[dependencies]
cxx = "1.0.95"
cxx-qt = "0.7"
cxx-qt-lib = { version = "0.7", default-features = false, features = ["qt_gui", "qt_qml"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[build-dependencies]
cxx-qt-build = { version = "0.7", features = ["link_qt_object_files"] }
